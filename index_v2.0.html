<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixVault 2.0</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #0b1020;
        --panel: #121a2d;
        --panel-2: #18223a;
        --border: #293653;
        --text: #eef3ff;
        --muted: #91a0bd;
        --accent: #6d7cff;
        --accent-2: #8d97ff;
        --danger: #ff5f70;
        --success: #42d6a4;
        --warning: #f3c969;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 10% 0%, #1b2850 0, transparent 35%),
            radial-gradient(circle at 90% 10%, #20204b 0, transparent 30%),
            var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ================= HEADER ================= */

    header {
        height: 76px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 16, 32, .88);
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    .brand-icon {
        width: 43px;
        height: 43px;
        border-radius: 13px;
        background: linear-gradient(135deg, var(--accent), #4f5bd5);
        display: grid;
        place-items: center;
        font-size: 22px;
        box-shadow: 0 8px 25px rgba(109,124,255,.25);
    }

    .brand h1 {
        font-size: 21px;
        letter-spacing: .4px;
    }

    .brand p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
    }

    .version {
        color: var(--accent-2);
        font-size: 11px;
        margin-left: 6px;
    }

    .add-button {
        border: 0;
        background: var(--accent);
        color: white;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: bold;
        transition: .2s;
    }

    .add-button:hover {
        transform: translateY(-1px);
        background: var(--accent-2);
    }

    /* ================= LAYOUT ================= */

    .workspace {
        width: min(1400px, 94%);
        margin: 28px auto 50px;
        flex: 1;
    }

    .welcome {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
    }

    .welcome h2 {
        font-size: 29px;
        margin-bottom: 7px;
    }

    .welcome p {
        color: var(--muted);
        font-size: 14px;
    }

    .storage-info {
        text-align: right;
        color: var(--muted);
        font-size: 12px;
    }

    .storage-info strong {
        display: block;
        color: var(--text);
        font-size: 20px;
        margin-top: 4px;
    }

    /* ================= CATEGORIES ================= */

    .categories {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 25px;
    }

    .category {
        border: 1px solid var(--border);
        background: rgba(18, 26, 45, .88);
        border-radius: 16px;
        padding: 19px;
        text-align: left;
        color: var(--text);
        transition: .2s;
    }

    .category:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
    }

    .category.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
        background: #171f39;
    }

    .category-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 17px;
    }

    .category-icon {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: var(--panel-2);
        display: grid;
        place-items: center;
        font-size: 20px;
    }

    .category-count {
        color: var(--muted);
        font-size: 12px;
    }

    .category h3 {
        font-size: 15px;
        margin-bottom: 5px;
    }

    .category p {
        color: var(--muted);
        font-size: 12px;
    }

    /* ================= NAV ================= */

    .toolbar {
        background: rgba(18, 26, 45, .92);
        border: 1px solid var(--border);
        border-radius: 15px 15px 0 0;
        padding: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }

    .nav-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .nav-button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 9px 13px;
        border-radius: 8px;
        font-weight: bold;
    }

    .nav-button:hover {
        color: var(--text);
        background: var(--panel-2);
    }

    .nav-button.active {
        color: white;
        background: var(--panel-2);
        border-color: var(--border);
    }

    .search {
        width: 230px;
        background: #0d1425;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 12px;
        color: var(--text);
        outline: none;
    }

    .search:focus {
        border-color: var(--accent);
    }

    /* ================= ACTION BAR ================= */

    .selection-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 15px;
        background: #202b48;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
    }

    .selection-bar.show {
        display: flex;
    }

    .selection-text {
        font-size: 13px;
        font-weight: bold;
    }

    .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .action {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 11px;
        border-radius: 7px;
        font-size: 12px;
    }

    .action:hover {
        border-color: var(--accent);
    }

    .action.danger {
        color: #ff8996;
    }

    .action.success {
        color: #66e2ba;
    }

    /* ================= CONTENT ================= */

    .content {
        min-height: 430px;
        border: 1px solid var(--border);
        border-top: 0;
        background: rgba(12, 18, 32, .75);
        border-radius: 0 0 15px 15px;
        padding: 20px;
    }

    .drop-zone {
        border: 1px dashed #42527a;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: center;
        color: var(--muted);
        transition: .2s;
    }

    .drop-zone.dragging {
        border-color: var(--accent);
        background: rgba(109,124,255,.08);
        color: var(--text);
    }

    .drop-zone strong {
        color: var(--text);
    }

    /* ================= FILE GRID ================= */

    .file-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 15px;
    }

    .file-card {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 13px;
        overflow: hidden;
        transition: .18s;
    }

    .file-card:hover {
        border-color: #46567d;
        transform: translateY(-1px);
    }

    .file-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
    }

    .check {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 22px;
        height: 22px;
        z-index: 3;
        accent-color: var(--accent);
        cursor: pointer;
    }

    .preview {
        height: 145px;
        background: #0d1425;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .file-symbol {
        font-size: 43px;
    }

    .file-info {
        padding: 13px;
    }

    .file-name {
        font-size: 13px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 6px;
    }

    .file-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
        gap: 8px;
    }

    .trash-date {
        color: #ff8794;
    }

    /* ================= EMPTY ================= */

    .empty {
        min-height: 360px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: var(--muted);
    }

    .empty-icon {
        font-size: 55px;
        margin-bottom: 13px;
        opacity: .75;
    }

    .empty h3 {
        color: var(--text);
        font-size: 18px;
        margin-bottom: 7px;
    }

    .empty p {
        max-width: 430px;
        line-height: 1.6;
        font-size: 13px;
    }

    /* ================= TOAST ================= */

    .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: #202b48;
        border: 1px solid var(--border);
        color: white;
        padding: 13px 17px;
        border-radius: 10px;
        box-shadow: 0 15px 40px rgba(0,0,0,.35);
        opacity: 0;
        transform: translateY(15px);
        pointer-events: none;
        transition: .25s;
        z-index: 100;
        font-size: 13px;
    }

    .toast.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* ================= FOOTER ================= */

    footer {
        text-align: center;
        color: #667592;
        font-size: 11px;
        padding: 0 20px 25px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
        .categories {
            grid-template-columns: repeat(2, 1fr);
        }

        .welcome {
            align-items: flex-start;
            flex-direction: column;
        }

        .storage-info {
            text-align: left;
        }
    }

    @media (max-width: 600px) {
        header {
            padding: 0 15px;
        }

        .brand p {
            display: none;
        }

        .add-button {
            padding: 10px 12px;
            font-size: 12px;
        }

        .workspace {
            width: 94%;
            margin-top: 18px;
        }

        .categories {
            grid-template-columns: 1fr;
        }

        .toolbar {
            align-items: stretch;
        }

        .search {
            width: 100%;
        }

        .selection-bar {
            flex-direction: column;
            align-items: stretch;
        }
    }
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        <div class="brand-icon">✦</div>

        <div>
            <h1>
                PixVault
                <span class="version">2.0</span>
            </h1>
            <p>Biblioteca personal de archivos</p>
        </div>
    </div>

    <button class="add-button" onclick="abrirSelector()">
        ＋ Agregar archivos
    </button>

    <input
        type="file"
        id="fileInput"
        multiple
        hidden
    >
</header>


<main class="workspace">

    <section class="welcome">

        <div>
            <h2 id="sectionTitle">Biblioteca</h2>
            <p id="sectionDescription">
                Organiza tus archivos desde un solo lugar.
            </p>
        </div>

        <div class="storage-info">
            Archivos almacenados
            <strong id="totalCount">0</strong>
        </div>

    </section>


    <!-- CATEGORÍAS -->

    <section class="categories">

        <button
            class="category active"
            data-category="todos"
            onclick="seleccionarCategoria('todos')"
        >
            <div class="category-top">
                <div class="category-icon">◈</div>
                <span class="category-count" id="countTodos">0</span>
            </div>

            <h3>Todos los archivos</h3>
            <p>Vista general de tu biblioteca</p>
        </button>


        <button
            class="category"
            data-category="imagenes"
            onclick="seleccionarCategoria('imagenes')"
        >
            <div class="category-top">
                <div class="category-icon">▧</div>
                <span class="category-count" id="countImagenes">0</span>
            </div>

            <h3>Imágenes</h3>
            <p>Fotos, capturas y gráficos</p>
        </button>


        <button
            class="category"
            data-category="documentos"
            onclick="seleccionarCategoria('documentos')"
        >
            <div class="category-top">
                <div class="category-icon">▤</div>
                <span class="category-count" id="countDocumentos">0</span>
            </div>

            <h3>Documentos</h3>
            <p>PDF, Word, texto y similares</p>
        </button>


        <button
            class="category"
            data-category="conversaciones"
            onclick="seleccionarCategoria('conversaciones')"
        >
            <div class="category-top">
                <div class="category-icon">◌</div>
                <span class="category-count" id="countConversaciones">0</span>
            </div>

            <h3>Conversaciones</h3>
            <p>Exportaciones y archivos de chat</p>
        </button>

    </section>


    <!-- NAVEGACIÓN -->

    <section class="toolbar">

        <div class="nav-buttons">

            <button
                class="nav-button active"
                id="libraryButton"
                onclick="cambiarVista('biblioteca')"
            >
                📚 Biblioteca
            </button>

            <button
                class="nav-button"
                id="trashButton"
                onclick="cambiarVista('papelera')"
            >
                🗑️ Papelera
                <span id="trashCount">0</span>
            </button>

        </div>


        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Buscar archivo..."
            oninput="renderizar()"
        >

    </section>


    <!-- ACCIONES DE SELECCIÓN -->

    <section
        class="selection-bar"
        id="selectionBar"
    >

        <div class="selection-text">
            <span id="selectedCount">0</span>
            seleccionados
        </div>

        <div class="actions">

            <button
                class="action"
                onclick="seleccionarTodos()"
            >
                Seleccionar todos
            </button>

            <button
                class="action"
                onclick="deseleccionarTodos()"
            >
                Deseleccionar
            </button>

            <button
                class="action success"
                id="restoreButton"
                onclick="restaurarSeleccionados()"
                style="display:none"
            >
                Restaurar
            </button>

            <button
                class="action danger"
                id="trashAction"
                onclick="enviarSeleccionadosPapelera()"
            >
                Mover a papelera
            </button>

            <button
                class="action danger"
                id="deleteAction"
                onclick="eliminarDefinitivamente()"
                style="display:none"
            >
                Eliminar definitivamente
            </button>

        </div>

    </section>


    <!-- CONTENIDO -->

    <section class="content">

        <div
            class="drop-zone"
            id="dropZone"
        >
            <strong>Arrastra archivos aquí</strong>
            <br>
            o utiliza el botón <strong>＋ Agregar archivos</strong>
        </div>


        <div
            class="file-grid"
            id="fileGrid"
        ></div>

    </section>

</main>


<footer>
    PixVault 2.0 · Gestión local de archivos
</footer>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   PIXVAULT 2.0
   NUEVA BASE DE DATOS
   NO TOCA EL PIXVAULT ANTERIOR
========================================================= */

const DB_NAME = "PixVault20DB";
const DB_VERSION = 1;
const STORE_NAME = "archivos";

let db = null;

let vistaActual = "biblioteca";
let categoriaActual = "todos";

let seleccionados = new Set();


/* =========================================================
   INICIO
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    iniciarBaseDatos();

    const fileInput = document.getElementById("fileInput");

    fileInput.addEventListener("change", async (event) => {

        const archivos = Array.from(event.target.files);

        if (archivos.length > 0) {
            await guardarArchivos(archivos);
        }

        fileInput.value = "";
    });


    configurarArrastre();

});


/* =========================================================
   INDEXED DB
========================================================= */

function iniciarBaseDatos() {

    const solicitud = indexedDB.open(DB_NAME, DB_VERSION);

    solicitud.onupgradeneeded = (event) => {

        db = event.target.result;

        if (!db.objectStoreNames.contains(STORE_NAME)) {

            const store = db.createObjectStore(
                STORE_NAME,
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

            store.createIndex(
                "estado",
                "estado",
                { unique: false }
            );

            store.createIndex(
                "categoria",
                "categoria",
                { unique: false }
            );

            store.createIndex(
                "nombre",
                "nombre",
                { unique: false }
            );
        }
    };


    solicitud.onsuccess = (event) => {

        db = event.target.result;

        renderizar();
    };


    solicitud.onerror = () => {

        mostrarToast(
            "No se pudo abrir la biblioteca local."
        );
    };
}


/* =========================================================
   SELECTOR DE ARCHIVOS
========================================================= */

function abrirSelector() {

    document.getElementById("fileInput").click();
}


/* =========================================================
   CLASIFICAR ARCHIVOS
========================================================= */

function detectarCategoria(archivo) {

    const tipo = archivo.type.toLowerCase();

    const nombre = archivo.name.toLowerCase();


    /* IMÁGENES */

    if (tipo.startsWith("image/")) {

        return "imagenes";
    }


    /* DOCUMENTOS */

    const extensionesDocumentos = [
        ".pdf",
        ".doc",
        ".docx",
        ".xls",
        ".xlsx",
        ".ppt",
        ".pptx",
        ".txt",
        ".rtf",
        ".csv",
        ".odt",
        ".ods",
        ".odp"
    ];

    if (
        extensionesDocumentos.some(
            extension => nombre.endsWith(extension)
        )
    ) {

        return "documentos";
    }


    /* CONVERSACIONES / EXPORTACIONES */

    const extensionesConversaciones = [
        ".json",
        ".html",
        ".xml",
        ".chat",
        ".conversation",
        ".conversations"
    ];

    if (
        extensionesConversaciones.some(
            extension => nombre.endsWith(extension)
        )
    ) {

        return "conversaciones";
    }


    /* OTROS */

    return "otros";
}


/* =========================================================
   GUARDAR ARCHIVOS
========================================================= */

async function guardarArchivos(archivos) {

    if (!db) {

        mostrarToast("La biblioteca todavía está iniciando.");

        return;
    }


    let guardados = 0;


    for (const archivo of archivos) {

        try {

            const registro = {

                nombre: archivo.name,

                tipoMime: archivo.type || "application/octet-stream",

                tamaño: archivo.size,

                categoria:
    categoriaActual === "conversaciones"
        ? "conversaciones"
        : detectarCategoria(archivo),

                estado: "biblioteca",

                fechaCreacion: new Date().toISOString(),

                archivo: archivo
            };


            await guardarRegistro(registro);

            guardados++;

        } catch (error) {

            console.error(
                "Error guardando:",
                archivo.name,
                error
            );
        }
    }


    seleccionados.clear();

    mostrarToast(
        `${guardados} archivo(s) agregado(s)`
    );

    renderizar();
}


/* =========================================================
   GUARDAR UN REGISTRO
========================================================= */

function guardarRegistro(registro) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                [STORE_NAME],
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const solicitud =
            store.add(registro);


        solicitud.onsuccess = () => {

            resolve(solicitud.result);
        };


        solicitud.onerror = () => {

            reject(solicitud.error);
        };

    });
}


/* =========================================================
   OBTENER TODOS
========================================================= */

function obtenerTodos() {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                [STORE_NAME],
                "readonly"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const solicitud =
            store.getAll();


        solicitud.onsuccess = () => {

            resolve(solicitud.result);
        };


        solicitud.onerror = () => {

            reject(solicitud.error);
        };

    });
}


/* =========================================================
   ACTUALIZAR
========================================================= */

function actualizarRegistro(registro) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                [STORE_NAME],
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const solicitud =
            store.put(registro);


        solicitud.onsuccess = () => {

            resolve();
        };


        solicitud.onerror = () => {

            reject(solicitud.error);
        };

    });
}


/* =========================================================
   ELIMINAR REGISTRO
========================================================= */

function eliminarRegistro(id) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                [STORE_NAME],
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        const solicitud =
            store.delete(id);


        solicitud.onsuccess = () => {

            resolve();
        };


        solicitud.onerror = () => {

            reject(solicitud.error);
        };

    });
}


/* =========================================================
   CAMBIAR VISTA
========================================================= */

function cambiarVista(vista) {

    vistaActual = vista;

    seleccionados.clear();

    document
        .getElementById("libraryButton")
        .classList.toggle(
            "active",
            vista === "biblioteca"
        );


    document
        .getElementById("trashButton")
        .classList.toggle(
            "active",
            vista === "papelera"
        );


    document.getElementById("sectionTitle").textContent =
        vista === "biblioteca"
            ? "Biblioteca"
            : "Papelera";


    document.getElementById("sectionDescription").textContent =
        vista === "biblioteca"
            ? "Organiza tus archivos desde un solo lugar."
            : "Archivos retirados de la biblioteca.";


    renderizar();
}


/* =========================================================
   CAMBIAR CATEGORÍA
========================================================= */

function seleccionarCategoria(categoria) {

    categoriaActual = categoria;

    document
        .querySelectorAll(".category")
        .forEach(elemento => {

            elemento.classList.toggle(
                "active",
                elemento.dataset.category === categoria
            );

        });


    seleccionados.clear();

    renderizar();
}


/* =========================================================
   RENDERIZAR
========================================================= */

async function renderizar() {

    if (!db) {
        return;
    }


    const archivos = await obtenerTodos();


    const archivosVista =
        archivos.filter(
            archivo =>
                archivo.estado === vistaActual
        );


    const archivosCategoria =
        categoriaActual === "todos"
            ? archivosVista
            : archivosVista.filter(
                archivo =>
                    archivo.categoria === categoriaActual
            );


    const textoBusqueda =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const archivosFinales =
        textoBusqueda === ""
            ? archivosCategoria
            : archivosCategoria.filter(
                archivo =>
                    archivo.nombre
                        .toLowerCase()
                        .includes(textoBusqueda)
            );


    renderizarContadores(archivos);


    renderizarArchivos(archivosFinales);

    actualizarBarraSeleccion();
}


/* =========================================================
   CONTADORES
========================================================= */

function renderizarContadores(archivos) {

    const biblioteca =
        archivos.filter(
            archivo =>
                archivo.estado === "biblioteca"
        );


    const papelera =
        archivos.filter(
            archivo =>
                archivo.estado === "papelera"
        );


    document.getElementById("totalCount").textContent =
        biblioteca.length;


    document.getElementById("countTodos").textContent =
        biblioteca.length;


    document.getElementById("countImagenes").textContent =
        biblioteca.filter(
            archivo =>
                archivo.categoria === "imagenes"
        ).length;


    document.getElementById("countDocumentos").textContent =
        biblioteca.filter(
            archivo =>
                archivo.categoria === "documentos"
        ).length;


    document.getElementById("countConversaciones").textContent =
        biblioteca.filter(
            archivo =>
                archivo.categoria === "conversaciones"
        ).length;


    document.getElementById("trashCount").textContent =
        papelera.length;
}


/* =========================================================
   MOSTRAR ARCHIVOS
========================================================= */

function renderizarArchivos(archivos) {

    const grid =
        document.getElementById("fileGrid");


    grid.innerHTML = "";


    if (archivos.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ${vistaActual === "papelera" ? "🗑️" : "◈"}
                </div>

                <h3>
                    ${
                        vistaActual === "papelera"
                            ? "La papelera está vacía"
                            : "No hay archivos aquí"
                    }
                </h3>

                <p>
                    ${
                        vistaActual === "papelera"
                            ? "Los archivos que retires de tu biblioteca aparecerán aquí."
                            : "Agrega archivos para comenzar a construir tu biblioteca."
                    }
                </p>

            </div>

        `;

        return;
    }


    archivos.forEach(
        archivo =>
            grid.appendChild(
                crearTarjeta(archivo)
            )
    );
}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(archivo) {

    const tarjeta =
        document.createElement("article");


    tarjeta.className = "file-card";


    if (seleccionados.has(archivo.id)) {

        tarjeta.classList.add("selected");
    }


    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.className = "check";

    checkbox.checked =
        seleccionados.has(archivo.id);


    checkbox.addEventListener(
        "change",
        () => {

            if (checkbox.checked) {

                seleccionados.add(archivo.id);

            } else {

                seleccionados.delete(archivo.id);
            }


            tarjeta.classList.toggle(
                "selected",
                checkbox.checked
            );


            actualizarBarraSeleccion();
        }
    );


    const preview =
        document.createElement("div");

    preview.className = "preview";


    if (
        archivo.categoria === "imagenes" &&
        archivo.archivo
    ) {

        const imagen =
            document.createElement("img");


        const url =
            URL.createObjectURL(
                archivo.archivo
            );


        imagen.src = url;


        imagen.onload = () => {

            URL.revokeObjectURL(url);
        };


        preview.appendChild(imagen);

    } else {

        const simbolo =
            document.createElement("div");

        simbolo.className =
            "file-symbol";

        simbolo.textContent =
            obtenerIcono(archivo);


        preview.appendChild(simbolo);
    }


    const info =
        document.createElement("div");

    info.className =
        "file-info";


    const nombre =
        document.createElement("div");

    nombre.className =
        "file-name";

    nombre.title =
        archivo.nombre;

    nombre.textContent =
        archivo.nombre;


    const meta =
        document.createElement("div");

    meta.className =
        "file-meta";


    const tipo =
        document.createElement("span");

    tipo.textContent =
        obtenerNombreCategoria(
            archivo.categoria
        );


    const tamaño =
        document.createElement("span");

    tamaño.textContent =
        formatearTamaño(
            archivo.tamaño
        );


    meta.appendChild(tipo);

    meta.appendChild(tamaño);


    info.appendChild(nombre);

    info.appendChild(meta);


    if (archivo.estado === "papelera") {

        const fecha =
            document.createElement("div");

        fecha.className =
            "file-meta trash-date";

        fecha.style.marginTop =
            "7px";

        fecha.textContent =
            "En papelera";


        info.appendChild(fecha);
    }


    tarjeta.appendChild(checkbox);

    tarjeta.appendChild(preview);

    tarjeta.appendChild(info);


    return tarjeta;
}


/* =========================================================
   ICONOS
========================================================= */

function obtenerIcono(archivo) {

    if (archivo.categoria === "documentos") {

        const nombre =
            archivo.nombre.toLowerCase();


        if (nombre.endsWith(".pdf")) {

            return "📕";
        }


        if (
            nombre.endsWith(".doc") ||
            nombre.endsWith(".docx")
        ) {

            return "📘";
        }


        if (
            nombre.endsWith(".xls") ||
            nombre.endsWith(".xlsx")
        ) {

            return "📗";
        }


        return "📄";
    }


    if (archivo.categoria === "conversaciones") {

        return "💬";
    }


    return "📦";
}


/* =========================================================
   NOMBRE CATEGORÍA
========================================================= */

function obtenerNombreCategoria(categoria) {

    const nombres = {

        imagenes: "Imagen",

        documentos: "Documento",

        conversaciones: "Conversación",

        otros: "Otro"
    };


    return nombres[categoria] || "Archivo";
}


/* =========================================================
   TAMAÑO
========================================================= */

function formatearTamaño(bytes) {

    if (!bytes) {

        return "0 KB";
    }


    const unidades = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    const indice =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    const valor =
        bytes /
        Math.pow(
            1024,
            indice
        );


    return (
        valor.toFixed(
            indice === 0 ? 0 : 1
        ) +
        " " +
        unidades[indice]
    );
}


/* =========================================================
   SELECCIÓN
========================================================= */

function seleccionarTodos() {

    const tarjetas =
        document.querySelectorAll(
            ".file-card"
        );


    tarjetas.forEach(
        tarjeta => {

            const checkbox =
                tarjeta.querySelector(
                    ".check"
                );


            if (checkbox) {

                checkbox.checked = true;

                checkbox.dispatchEvent(
                    new Event("change")
                );
            }
        }
    );
}


function deseleccionarTodos() {

    seleccionados.clear();

    renderizar();
}


/* =========================================================
   BARRA DE SELECCIÓN
========================================================= */

function actualizarBarraSeleccion() {

    const barra =
        document.getElementById(
            "selectionBar"
        );


    const cantidad =
        seleccionados.size;


    document.getElementById(
        "selectedCount"
    ).textContent =
        cantidad;


    barra.classList.toggle(
        "show",
        cantidad > 0
    );


    const esPapelera =
        vistaActual === "papelera";


    document.getElementById(
        "restoreButton"
    ).style.display =
        esPapelera && cantidad > 0
            ? "inline-block"
            : "none";


    document.getElementById(
        "deleteAction"
    ).style.display =
        esPapelera && cantidad > 0
            ? "inline-block"
            : "none";


    document.getElementById(
        "trashAction"
    ).style.display =
        !esPapelera && cantidad > 0
            ? "inline-block"
            : "none";
}


/* =========================================================
   ENVIAR A PAPELERA
========================================================= */

async function enviarSeleccionadosPapelera() {

    if (seleccionados.size === 0) {

        return;
    }


    const archivos =
        await obtenerTodos();


    const objetivos =
        archivos.filter(
            archivo =>
                seleccionados.has(
                    archivo.id
                )
        );


    for (const archivo of objetivos) {

        archivo.estado =
            "papelera";

        archivo.fechaPapelera =
            new Date().toISOString();


        await actualizarRegistro(
            archivo
        );
    }


    const cantidad =
        objetivos.length;


    seleccionados.clear();


    mostrarToast(
        `${cantidad} archivo(s) enviado(s) a la papelera`
    );


    renderizar();
}


/* =========================================================
   RESTAURAR
========================================================= */

async function restaurarSeleccionados() {

    if (seleccionados.size === 0) {

        return;
    }


    const archivos =
        await obtenerTodos();


    const objetivos =
        archivos.filter(
            archivo =>
                seleccionados.has(
                    archivo.id
                )
        );


    for (const archivo of objetivos) {

        archivo.estado =
            "biblioteca";

        delete archivo.fechaPapelera;


        await actualizarRegistro(
            archivo
        );
    }


    const cantidad =
        objetivos.length;


    seleccionados.clear();


    mostrarToast(
        `${cantidad} archivo(s) restaurado(s)`
    );


    renderizar();
}


/* =========================================================
   ELIMINAR DEFINITIVAMENTE
========================================================= */

async function eliminarDefinitivamente() {

    if (seleccionados.size === 0) {

        return;
    }


    const confirmar =
        confirm(
            "¿Eliminar definitivamente los archivos seleccionados?\n\nEsta acción no se puede deshacer."
        );


    if (!confirmar) {

        return;
    }


    const ids =
        Array.from(
            seleccionados
        );


    for (const id of ids) {

        await eliminarRegistro(id);
    }


    seleccionados.clear();


    mostrarToast(
        `${ids.length} archivo(s) eliminado(s) definitivamente`
    );


    renderizar();
}


/* =========================================================
   ARRASTRAR Y SOLTAR
========================================================= */

function configurarArrastre() {

    const zona =
        document.getElementById(
            "dropZone"
        );


    zona.addEventListener(
        "dragover",
        event => {

            event.preventDefault();

            zona.classList.add(
                "dragging"
            );
        }
    );


    zona.addEventListener(
        "dragleave",
        () => {

            zona.classList.remove(
                "dragging"
            );
        }
    );


    zona.addEventListener(
        "drop",
        async event => {

            event.preventDefault();

            zona.classList.remove(
                "dragging"
            );


            const archivos =
                Array.from(
                    event.dataTransfer.files
                );


            if (archivos.length > 0) {

                await guardarArchivos(
                    archivos
                );
            }
        }
    );
}


/* =========================================================
   MENSAJE
========================================================= */

let toastTimer = null;


function mostrarToast(mensaje) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        mensaje;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2800
        );
}
